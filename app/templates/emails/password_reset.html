<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; color: #222;">
    <h2>Reset your password</h2>
    <p>Hello {{ name }},</p>
    <p>We received a request to reset the password for your NGO Management account.</p>
    <p>Use this one-time token within {{ expires_minutes }} minutes:</p>
    <p style="font-size: 16px; background: #f4f4f4; padding: 10px; word-break: break-all;"><code>{{ token }}</code></p>
    <p>If you did not request this, you can safely ignore this email.</p>
  </body>
</html>
